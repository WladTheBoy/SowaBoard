                    format: uuid
                  projectId:
                    type: string
                    format: uuid
                  title:
                    type: string
                  content:
                    type:
                      - string
                      - "null"
                  icon:
                    type:
                      - string
                      - "null"
                  parentId:
                    type:
                      - string
                      - "null"
                    format: uuid
                  order:
                    type: integer
                  createdById:
                    type: string
                    format: uuid
                  updatedById:
                    type:
                      - string
                      - "null"
                    format: uuid
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                required:
                  - id
                  - projectId
                  - title
                  - content
                  - icon
                  - parentId
                  - order
                  - createdById
                  - updatedById
                  - createdAt
                  - updatedAt
        "404":
          description: Page not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
        "500":
          description: Could not get page
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
    patch:
      summary: Update a page
      tags:
        - Pages
      security:
        - BearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                content:
                  type:
                    - string
                    - "null"
                icon:
                  type:
                    - string
                    - "null"
                  maxLength: 100
                parentId:
                  type:
                    - string
                    - "null"
                  format: uuid
                order:
                  type: integer
      responses:
        "200":
          description: Page updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  projectId:
                    type: string
                    format: uuid
                  title:
                    type: string
                  content:
                    type:
                      - string
                      - "null"
                  icon:
                    type:
                      - string
                      - "null"
                  parentId:
                    type:
                      - string
                      - "null"
                    format: uuid
                  order:
                    type: integer
                  createdById:
                    type: string
                    format: uuid
                  updatedById:
                    type:
                      - string
                      - "null"
                    format: uuid
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                required:
                  - id
                  - projectId
                  - title
                  - content
                  - icon
                  - parentId
                  - order
                  - createdById
                  - updatedById
                  - createdAt
                  - updatedAt
        "400":
          description: Parent page would create a cycle
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
        "404":
          description: Page or parent page not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
        "500":
          description: Could not update page
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
    delete:
      summary: Delete a page
      tags:
        - Pages
      security:
        - BearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      responses:
        "204":
          description: Page deleted
        "404":
          description: Page not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
        "409":
          description: Page has child pages
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
        "500":
          description: Could not delete page
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
