          description: Project deleted
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
        "409":
          description: Project still has tickets or pages
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
        "500":
          description: Could not delete project
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
  /ticket-statuses:
    get:
      summary: List ticket statuses
      tags:
        - Ticket Statuses
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Available ticket statuses
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  enum:
                    - todo
                    - in-progress
                    - done
        "500":
          description: Could not list ticket statuses
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
  /ticket-priorities:
    get:
      summary: List ticket priorities
      tags:
        - Ticket Priorities
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Available ticket priorities
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  enum:
                    - Niedrig
                    - Mittel
                    - Hoch
        "500":
          description: Could not list ticket priorities
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
  /tickets:
    post:
      summary: Create a ticket
      tags:
        - Tickets
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                projectId:
                  type: string
                  format: uuid
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                description:
                  type: string
                priority:
                  type: string
                  enum:
                    - Niedrig
                    - Mittel
                    - Hoch
                assignee:
                  type: string
                  minLength: 1
                status:
                  type: string
                  enum:
                    - todo
                    - in-progress
                    - done
                label:
                  type: string
                  minLength: 1
              required:
                - projectId
                - title
                - description
                - priority
                - assignee
                - status
                - label
      responses:
        "201":
          description: Ticket created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  projectId:
                    type: string
                    format: uuid
                  title:
                    type: string
                  description:
                    type: string
                  priority:
                    type: string
                    enum:
                      - Niedrig
                      - Mittel
                      - Hoch
                  assignee:
                    type: string
                  status:
                    type: string
                    enum:
                      - todo
                      - in-progress
                      - done
                  label:
                    type: string
                required:
                  - id
                  - projectId
                  - title
                  - description
                  - priority
                  - assignee
                  - status
                  - label
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
        "500":
          description: Could not create ticket
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
    get:
      summary: List tickets
      tags:
        - Tickets
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Tickets returned
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    projectId:
                      type: string
                      format: uuid
                    title:
                      type: string
                    description:
                      type: string
                    priority:
                      type: string
                      enum:
                        - Niedrig
                        - Mittel
                        - Hoch
                    assignee:
                      type: string
                    status:
                      type: string
                      enum:
                        - todo
                        - in-progress
                        - done
                    label:
                      type: string
                  required:
                    - id
                    - projectId
                    - title
                    - description
                    - priority
                    - assignee
                    - status
                    - label
        "500":
          description: Could not list tickets
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
  /tickets/{id}:
    get:
      summary: Get a ticket
      tags:
        - Tickets
      security:
        - BearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Ticket returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  projectId:
                    type: string
                    format: uuid
                  title:
                    type: string
                  description:
                    type: string
                  priority:
                    type: string
                    enum:
                      - Niedrig
                      - Mittel
                      - Hoch
                  assignee:
                    type: string
                  status:
                    type: string
                    enum:
                      - todo
                      - in-progress
                      - done
                  label:
                    type: string
                required:
                  - id
                  - projectId
                  - title
                  - description
                  - priority
                  - assignee
                  - status
                  - label
        "404":
          description: Ticket not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
        "500":
          description: Could not get ticket
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
    patch:
      summary: Update a ticket
      tags:
        - Tickets
      security:
        - BearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                projectId:
                  type: string
                  format: uuid
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                description:
                  type: string
                priority:
                  type: string
                  enum:
                    - Niedrig
                    - Mittel
                    - Hoch
                assignee:
                  type: string
                  minLength: 1
                status:
                  type: string
                  enum:
                    - todo
                    - in-progress
                    - done
                label:
                  type: string
                  minLength: 1
      responses:
        "200":
          description: Ticket updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  projectId:
                    type: string
                    format: uuid
                  title:
                    type: string
                  description:
                    type: string
                  priority:
                    type: string
                    enum:
                      - Niedrig
                      - Mittel
                      - Hoch
                  assignee:
                    type: string
                  status:
                    type: string
                    enum:
                      - todo
                      - in-progress
                      - done
                  label:
                    type: string
                required:
                  - id
                  - projectId
                  - title
                  - description
                  - priority
                  - assignee
                  - status
                  - label
        "404":
          description: Ticket or project not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
        "500":
          description: Could not update ticket
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
    delete:
      summary: Delete a ticket
      tags:
        - Tickets
      security:
        - BearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      responses:
        "204":
          description: Ticket deleted
        "404":
          description: Ticket not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
        "500":
          description: Could not delete ticket
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
webhooks: {}
